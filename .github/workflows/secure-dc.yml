name: secure-dc
# PUBLIC runner-shell for the HP-Secure 2.0 datacenter baseline gate of the PRIVATE hp_secure_fixed_3.0.
# NO RTL, NO source committed here: the private repo is cloned at runtime with RTL_RUN_TOKEN_SECURE if set,
# else RTL_RUN_TOKEN1 (fine-grained PAT, Contents Read-only; masked; clone errors scrubbed).
#
# DISCLOSURE SURFACE — this log is world-readable. What reaches it, and NOTHING more:
#   · runner capability (cores / mem / disk) and tool versions (public tools)
#   · per step, ONE verdict line "PASS: <step>" / "FAIL: <step>" (verif/ci/secure_dc_gate.sh), plus exit code
# Never echoed: build logs, verilator command lines, harness output, module or signal names.
# No artifacts uploaded; no RTL build cached.
#
# STRICTLY SERIAL — shared repo, one job at a time, each verdict standalone:
#   smoke -> e2e -> aes-round -> tenancy-1e4t -> tenancy-4e4t -> product -> dc-isolation
#   gh workflow run secure-dc.yml --repo rahulprospera/RunDirectory -f branch=ci/secure-dc
#   subset: -f steps='tenancy-1e4t tenancy-4e4t'   (unselected steps are skipped, order kept)
# On FAIL a step may also print ONE coarse 'STAGE: <step> disk|oom|verilate|link|cxx|make|run|none' tag (no names).
on:
  workflow_dispatch:
    inputs:
      branch: { description: 'private branch to run', default: 'ci/secure-dc' }
      steps:  { description: "'all' or a space-separated subset", default: 'all' }
permissions: { contents: read }
concurrency: { group: secure-dc, cancel-in-progress: false }
jobs:
  smoke:
    if: ${{ !cancelled() && (inputs.steps == 'all' || contains(format(' {0} ', inputs.steps), ' smoke ')) }}
    uses: ./.github/workflows/secure-dc-step.yml
    with: { step: smoke, branch: "${{ inputs.branch }}" }
    secrets: inherit
  e2e:
    needs: smoke
    if: ${{ !cancelled() && (inputs.steps == 'all' || contains(format(' {0} ', inputs.steps), ' e2e ')) }}
    uses: ./.github/workflows/secure-dc-step.yml
    with: { step: e2e, branch: "${{ inputs.branch }}" }
    secrets: inherit
  aes-round:
    needs: e2e
    if: ${{ !cancelled() && (inputs.steps == 'all' || contains(format(' {0} ', inputs.steps), ' aes-round ')) }}
    uses: ./.github/workflows/secure-dc-step.yml
    with: { step: aes-round, branch: "${{ inputs.branch }}" }
    secrets: inherit
  tenancy-1e4t:
    needs: aes-round
    if: ${{ !cancelled() && (inputs.steps == 'all' || contains(format(' {0} ', inputs.steps), ' tenancy-1e4t ')) }}
    uses: ./.github/workflows/secure-dc-step.yml
    with: { step: tenancy-1e4t, branch: "${{ inputs.branch }}" }
    secrets: inherit
  tenancy-4e4t:
    needs: tenancy-1e4t
    if: ${{ !cancelled() && (inputs.steps == 'all' || contains(format(' {0} ', inputs.steps), ' tenancy-4e4t ')) }}
    uses: ./.github/workflows/secure-dc-step.yml
    with: { step: tenancy-4e4t, branch: "${{ inputs.branch }}" }
    secrets: inherit
  product:
    needs: tenancy-4e4t
    if: ${{ !cancelled() && (inputs.steps == 'all' || contains(format(' {0} ', inputs.steps), ' product ')) }}
    uses: ./.github/workflows/secure-dc-step.yml
    with: { step: product, branch: "${{ inputs.branch }}" }
    secrets: inherit
  dc-isolation:
    needs: product
    if: ${{ !cancelled() && (inputs.steps == 'all' || contains(format(' {0} ', inputs.steps), ' dc-isolation ')) }}
    uses: ./.github/workflows/secure-dc-step.yml
    with: { step: dc-isolation, branch: "${{ inputs.branch }}" }
    secrets: inherit
