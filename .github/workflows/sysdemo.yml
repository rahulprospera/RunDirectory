name: sysdemo
# THE SYSTEM DEMO GATE — hpml_core (the host) driving hp_vpu_top (the tile).
#
# Stage 1, which is this file today: prove the FULL CORE builds and runs a program. Every other
# hp_ml_core workflow here builds a unit bench (hpml-timing2 builds tb_paged_ls, which has been
# red since before the timing work); none of them answers "can the composed machine execute
# instructions", and that is the only question a system demo depends on.
#
# Stage 2, once this is green: an SV system top instantiating hpml_core + a tile bridge +
# hp_vpu_top, with the CPU's stores to a memory-mapped window decoded onto the tile's launch
# ports. Both are SystemVerilog, so that is one netlist, not a C++ glue job.
#
# DISCLOSURE: this log is world-readable. Allowlisted verdict lines only — never the build log,
# which carries the verilator command line and therefore every RTL path and module name.
on:
  workflow_dispatch:
    inputs:
      core_branch: { description: 'hp_ml_core branch', default: 'rtl-timing-2' }
      width:       { description: 'issue_width to build at', default: '1' }
permissions: { contents: read }
concurrency: { group: sysdemo-${{ inputs.core_branch }}, cancel-in-progress: false }
jobs:
  core-runs-a-program:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/cache@v4
        with: { path: /opt/verilator, key: verilator-v5.048-u2404 }
      - uses: actions/cache@v4
        with: { path: /opt/spike, key: spike-riscv-isa-sim-u2404 }
      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-pip gcc-riscv64-unknown-elf device-tree-compiler
          echo "verilator: $(/opt/verilator/bin/verilator --version 2>/dev/null || echo MISSING)"
      - name: Free disk (elaborating the cluster tops is a ~5 GB process)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null; df -BG --output=avail / | tail -1
      - name: Checkout PRIVATE core (token masked)
        run: |
          set +e
          git clone --depth 1 --branch "${{ inputs.core_branch }}" \
            "https://x-access-token:${{ secrets.RTL_RUN_TOKEN1 }}@github.com/rahulprospera/hp_ml_core.git" core 2>ce.txt
          [ $? -eq 0 ] || { echo "checkout FAILED:"; sed -E 's#(https://)[^@]*@#\1***@#g' ce.txt; exit 1; }
          echo "core checkout ok"
      - name: Config + program images
        run: |
          export PATH=/opt/verilator/bin:/opt/spike/bin:$PATH
          cd core/rtl
          python3 - config/rtl_core.json ${{ inputs.width }} <<'PY'
          import json,sys
          p,w=sys.argv[1],int(sys.argv[2]); c=json.load(open(p)); c["issue_width"]=w
          json.dump(c,open(p,"w"),indent=2)
          PY
          python3 flow/gen_rtl_config.py >/dev/null
          echo "issue_width=$(python3 -c "import json;print(json.load(open('config/rtl_core.json'))['issue_width'])")"
          echo "mul_lat=$(python3 -c "import json;print(json.load(open('config/rtl_core.json'))['rtl_only']['mul_lat'])")"
          for s in tb/progs/build_*.sh; do [ -e "$s" ] && bash "$s" >/dev/null 2>&1; done
          echo "progs built: $(ls tb/progs/build/*.hex 2>/dev/null | wc -l)"
      - name: Build tb_m5_program (THE FULL CORE)
        run: |
          export PATH=/opt/verilator/bin:$PATH
          cd core/rtl
          set +e
          verilator --binary --timing -Wall -Wno-fatal -j 1 --top-module tb_m5_program \
            -y prim -y atoms -y leaves -y cluster -y tb \
            --Mdir /tmp/m5 -o tb tb/tb_m5_program.sv > /tmp/m5.build.log 2>&1
          echo "exit=$?" > /tmp/m5.rc
          [ -x /tmp/m5/tb ] && echo "EXECUTABLE BUILT" >> /tmp/m5.rc
      - name: Build verdict — ALLOWLIST ONLY
        run: |
          cat /tmp/m5.rc
          grep -q "EXECUTABLE BUILT" /tmp/m5.rc || { echo "VERDICT: full core does NOT build"; exit 1; }
          echo "VERDICT: full core builds"
      - name: Run a program on it
        run: |
          cd core/rtl
          set +e
          timeout 1800 /tmp/m5/tb > /tmp/m5.run.log 2>&1
          echo "run exit=$?" > /tmp/m5.runrc
      - name: Run verdict — ALLOWLIST ONLY
        run: |
          line=$(grep -i "self-test" /tmp/m5.run.log | head -1); echo "${line:-no self-test line}"
          grep -cE "^ *FAIL|ERROR" /tmp/m5.run.log | sed 's/^/FAIL-or-ERROR lines: /'
          cat /tmp/m5.runrc
          echo "$line" | grep -qi PASS && echo "VERDICT: PASS" || { echo "VERDICT: FAIL"; exit 1; }
      - name: Failure triage (allowlisted; RTL-shaped lines stripped)
        if: failure()
        run: |
          for L in /tmp/m5.build.log /tmp/m5.run.log; do
            [ -f "$L" ] || continue
            echo "--- $L, filtered ---"
            tail -60 "$L" | grep -viE '\.sv:|verilator |\+incdir|--Mdir|-y |%Warning' | tail -18
          done
          grep -oE "(%Error[^:]*:|USERERROR|Cannot find|No such file|undefined|Assertion)[^/]{0,90}" \
            /tmp/m5.build.log 2>/dev/null | sort -u | head -8 || true
