name: secure-dc-step
# PUBLIC runner-shell, ONE serialized step of secure-dc.yml (HP-Secure 2.0 datacenter baseline of the PRIVATE
# hp_secure_fixed_3.0). See secure-dc.yml for the disclosure surface: allowlisted verdict lines only.
on:
  workflow_call:
    inputs:
      step:   { required: true, type: string }
      branch: { required: true, type: string }
    secrets:
      RTL_RUN_TOKEN_SECURE: { required: false }
      RTL_RUN_TOKEN1:       { required: false }
permissions: { contents: read }
jobs:
  run:
    name: ${{ inputs.step }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # dedicated token if minted, else the shared one with hp_secure_fixed_3.0 added to its repo list
      TOK: ${{ secrets.RTL_RUN_TOKEN_SECURE || secrets.RTL_RUN_TOKEN1 }}
    steps:
      - name: Check the private-repo tunnel is alive
        run: |
          set +e
          git ls-remote "https://x-access-token:${TOK}@github.com/rahulprospera/hp_secure_fixed_3.0.git" HEAD >/dev/null 2>tok_err.txt
          if [ $? -ne 0 ]; then echo "::error title=no token can read hp_secure_fixed_3.0::Add hp_secure_fixed_3.0 (Contents Read-only) to RTL_RUN_TOKEN1, or set RTL_RUN_TOKEN_SECURE"; exit 1; fi
          echo "tunnel ok"
      - name: Cache Verilator (public tool)
        id: vc
        uses: actions/cache@v4
        with:
          path: /opt/verilator
          key: verilator-v5.048-u2404
      - name: Build Verilator (miss only)
        if: steps.vc.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git perl python3 make autoconf g++ flex bison ccache libgoogle-perftools-dev numactl zlib1g-dev help2man libfl-dev
          git clone -q https://github.com/verilator/verilator /tmp/v && cd /tmp/v && git checkout -q v5.048
          autoconf && ./configure --prefix=/opt/verilator >/dev/null && make -j"$(nproc)" >/dev/null && sudo make install >/dev/null
      - name: Runtime packages (public tools)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgoogle-perftools-dev zlib1g-dev ccache python3 time >/dev/null
          echo "cores=$(nproc) mem=$(free -g | awk '/^Mem:/{print $2}')GB disk=$(df -BG --output=avail / | tail -1 | tr -d ' ')"
      - name: Checkout PRIVATE repo (token masked; source never leaves the runner)
        run: |
          set +e
          git clone -q --depth 1 --branch "${{ inputs.branch }}" \
            "https://x-access-token:${TOK}@github.com/rahulprospera/hp_secure_fixed_3.0.git" src 2>clone_err.txt
          [ $? -eq 0 ] && echo "private checkout ok" || { echo "checkout FAILED (branch or token)"; exit 1; }
      - name: ${{ inputs.step }}  (ALL output captured to a file, NONE echoed)
        run: |
          export PATH=/opt/verilator/bin:$PATH
          export BUILD_JOBS=$(nproc)
          cd src
          set +e
          bash verif/ci/secure_dc_gate.sh "${{ inputs.step }}" > /tmp/step.log 2>&1
          echo "$?" > /tmp/step.rc
      - name: Verdict — ALLOWLIST ONLY (nothing else reaches this public log)
        if: always()
        run: |
          set +e
          grep -oE '^(PASS|FAIL): [a-z0-9-]+$' /tmp/step.log | tr -cd 'A-Za-z0-9_/=.:|(), \n-' | head -20
          echo "exit=$(cat /tmp/step.rc 2>/dev/null || echo missing)"
          grep -qx 0 /tmp/step.rc
