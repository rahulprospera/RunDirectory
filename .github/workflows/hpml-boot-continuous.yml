          set +e
          for x in "src ${{ inputs.branch }}" "data ${{ inputs.data }}"; do set -- $x
            git clone --depth 1 --branch "$2" \
              "https://x-access-token:${{ secrets.RTL_RUN_TOKEN_MLCORE }}@github.com/${{ env.REPO }}.git" "$1" 2>e.txt
            [ $? -eq 0 ] || { sed -E 's#(https://)[^@]*@#\1***@#g' e.txt; exit 1; }
          done
      - name: Restore co-sim Spike
        uses: actions/cache/restore@v4
        with: { path: /opt/spike-hpml, key: "spike-hpml-16c0b60-${{ hashFiles('src/test/boot_replay/spike_hpml_full.patch') }}-u2404", fail-on-cache-miss: true }
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq device-tree-compiler python3
      - uses: actions/download-artifact@v4
        with: { pattern: seg-*, path: segs }
      - uses: actions/download-artifact@v4
        with: { name: cont-sim, path: sim }
      - name: Stitch the segments and prove them against Spike
        run: |
          set -u
          n=$(ls -d segs/seg-* | wc -l)
          : > all.log; rm -f all.retire.gz
          for k in $(seq 0 $((n-1))); do cat segs/seg-$k/seg.log >> all.log; cat segs/seg-$k/retire.gz >> all.retire.gz; done
          mkdir -p img && cp data/reset/state.txt data/reset/fw_payload.elf img/ && zcat data/reset/mem.bin.gz > img/mem.bin
          bash src/test/boot_replay/cosim_continuous.sh img data/reset/spike.dtb all.retire.gz all.log proof \
            /opt/spike-hpml/bin/spike img/fw_payload.elf > verdict.txt 2>&1 || true
          {
            echo "# PROOF: continuous Linux boot of the RTL, reset -> userspace"
            echo
            echo "| item | value |"; echo "|---|---|"
            echo "| code branch / commit | ${{ inputs.branch }} / ${{ needs.build.outputs.sha }} |"
            echo "| sim binary md5 | $(cut -c1-32 sim/build/s/tb.md5) |"
            echo "| fw_payload.elf md5 | $(md5sum img/fw_payload.elf | cut -c1-32) |"
            echo "| Spike DTB md5 | $(md5sum data/reset/spike.dtb | cut -c1-32) |"
            echo "| Spike co-sim patch | $(sha1sum src/test/boot_replay/spike_hpml_full.patch | cut -c1-12) |"
            echo "| CI run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo "| segments | $n ($(cat segs/seg-*/status | tr '\n' ' ')) |"
            echo; echo "## Seams (each save must equal the next restore)"; echo '```'
            grep -h -E '^\[SEAM\]|^\[SAVABLE\]' all.log; echo '```'
            echo; echo "## Boot milestones from the RTL's own console"; echo '```'
            grep -h -aE 'OpenSBI v|Linux version|Run /init|REACHED USERSPACE|reached userspace|Kernel panic|WEDGE|maxcyc' all.log | head -40; echo '```'
            echo; echo "## Instruction-by-instruction verdict vs Spike (from the first instruction at 0x1000)"; echo '```'
            cat verdict.txt; echo '```'
          } > PROOF.md
          cat PROOF.md >> "$GITHUB_STEP_SUMMARY"; cat PROOF.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof
          retention-days: 30
          path: |
            PROOF.md
            all.log
            verdict.txt
            proof/events
            proof/spike_cosim.err

