          bash src/test/boot_replay/ci_segment.sh 1 "$PWD/sim/build/s/tb" data "$PWD/out" \
            "${{ inputs.wall_sec }}" "${{ inputs.seg_cycles }}" "${{ inputs.maxcyc }}" "$PWD/prev/save.sav.gz"
          echo "status=$(cut -d' ' -f1 out/status)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seg-1
          retention-days: 14
          path: |
            out/seg.log
            out/retire.gz
            out/status
      - uses: actions/upload-artifact@v4
