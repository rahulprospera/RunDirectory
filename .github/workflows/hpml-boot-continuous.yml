  proof:
    needs: [build, seg0, seg1, seg2, seg3, seg4, seg5, seg6, seg7, seg8, seg9]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Clone code + data
