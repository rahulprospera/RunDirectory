name: hpml-boot-continuous
# PUBLIC runner-shell.  NO RTL OR DATA COMMITTED HERE.  Clones the PRIVATE hp_ml_core at runtime.
#
# ONE continuous Linux boot of the RTL, from reset to userspace, as a chain of CI jobs.  The boot bench is built
# --savable (tb_m5_program `HPML_TB_SAVABLE, tb_boot_savable_main.cpp): each segment job runs until its wall budget,
# saves the WHOLE model, and the next job restores it and continues on the next edge -- one simulation, never a
# restart.  The proof job then diffs the WHOLE retire stream against a DUT-driven Spike co-sim from reset and
# writes PROOF.md.  Tools: test/boot_replay/ on the code branch.  Image: reset/ on the data branch.
on:
  workflow_dispatch:
    inputs:
      branch:   { description: 'hp_ml_core code branch (HPML_TB_BOOT enabled)', default: 'boot/continuous' }
      data:     { description: 'hp_ml_core data branch (reset/ image)', default: 'boot-replay/win500k-6.1' }
      wall_sec: { description: 'wall seconds per segment before saving', default: '18000' }
      seg_cycles: { description: 'cycles per segment before saving (0 = wall only)', default: '0' }
      maxcyc:   { description: 'hard cycle bound for the whole boot', default: '600000000' }
      control:  { description: 'also run an UNBROKEN control to maxcyc (continuity check, short runs only)', default: 'false' }
permissions: { contents: read }
concurrency: { group: hpml-boot-continuous, cancel-in-progress: false }
env:
  REPO: rahulprospera/hp_ml_core
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs: { sha: '${{ steps.b.outputs.sha }}' }
    steps:
      - uses: actions/cache@v4
        with: { path: /opt/verilator, key: verilator-v5.048-u2404 }
      - name: Clone code + data
        run: |
          set +e
          for x in "src ${{ inputs.branch }}" "data ${{ inputs.data }}"; do set -- $x
            git clone --depth 1 --branch "$2" \
              "https://x-access-token:${{ secrets.RTL_RUN_TOKEN_MLCORE }}@github.com/${{ env.REPO }}.git" "$1" 2>e.txt
            [ $? -eq 0 ] || { sed -E 's#(https://)[^@]*@#\1***@#g' e.txt; exit 1; }
          done
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache g++ python3
      - id: b
        name: Build the SAVABLE boot sim, W=2
        run: |
          export PATH=/opt/verilator/bin:$PATH
          cd src/rtl
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          grep -q '^`define HPML_TB_BOOT' tb/tb_m5_program.sv || { echo "branch does not enable HPML_TB_BOOT"; exit 1; }
          python3 - config/rtl_core.json 2 <<'PY'
          import json,sys
          p,w=sys.argv[1],int(sys.argv[2]); c=json.load(open(p)); c["issue_width"]=w
          json.dump(c,open(p,"w"),indent=2)
          PY
          python3 flow/gen_rtl_config.py >/dev/null
          mkdir -p build/s
          verilator --cc --exe --build --savable -Wall -Wno-fatal \
            -Werror-WIDTHEXPAND -Werror-WIDTHTRUNC -Werror-PINMISSING +define+HPML_TB_SAVABLE \
            -j "$(nproc)" --top-module tb_m5_program -y prim -y atoms -y leaves -y cluster -y tb \
            --Mdir build/s -o tb tb/tb_m5_program.sv tb/tb_boot_savable_main.cpp
          md5sum build/s/tb | tee build/s/tb.md5
      - uses: actions/upload-artifact@v4
        with:
          name: cont-sim
          retention-days: 7
          path: |
            src/rtl/build/s/tb
            src/rtl/build/s/tb.md5
            src/rtl/hpml_cfg.vh

  seg0:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs: { status: '${{ steps.r.outputs.status }}' }
    steps:
      - name: Clone code + data
        run: |
          set +e
          for x in "src ${{ inputs.branch }}" "data ${{ inputs.data }}"; do set -- $x
            git clone --depth 1 --branch "$2" \
              "https://x-access-token:${{ secrets.RTL_RUN_TOKEN_MLCORE }}@github.com/${{ env.REPO }}.git" "$1" 2>e.txt
            [ $? -eq 0 ] || { sed -E 's#(https://)[^@]*@#\1***@#g' e.txt; exit 1; }
          done
      - uses: actions/download-artifact@v4
        with: { name: cont-sim, path: sim }
      - id: r
        name: Segment 0
        run: |
          chmod +x sim/build/s/tb
          bash src/test/boot_replay/ci_segment.sh 0 "$PWD/sim/build/s/tb" data "$PWD/out" \
            "${{ inputs.wall_sec }}" "${{ inputs.seg_cycles }}" "${{ inputs.maxcyc }}"
          echo "status=$(cut -d' ' -f1 out/status)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seg-0
          retention-days: 14
          path: |
            out/seg.log
            out/retire.gz
            out/status
      - uses: actions/upload-artifact@v4
        if: steps.r.outputs.status == 'SAVED'
        with: { name: save-0, path: out/save.sav.gz, retention-days: 7 }
