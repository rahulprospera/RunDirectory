name: core-keys-tile
# Does hpml_core, the REAL core, build as a composed machine and execute a program?
#
# Every other hp_ml_core workflow here builds a unit bench. Those are green, which says the
# pieces work; none of them says the composed machine executes instructions, and that is the
# only fact that decides whether the system demo uses the real core or a shim.
#
# Allowlisted verdict only — the build log carries the verilator command line and therefore
# every RTL path and module name.
on:
  workflow_dispatch:
    inputs:
      branch: { description: 'hp_ml_core branch', default: 'rtl-timing-2' }
      # DEFAULT TO THEIR SHIPPED CONFIG. W=1 was a build-convenience choice that quietly
      # changed the machine: single-issue caps descriptor building at one store per cycle,
      # so the banked-LS / MSHR throughput argument cannot be exercised at all. Their
      # rtl_core.json ships issue_width=2; run what they ship.
      width:  { description: 'issue_width (their shipped default is 2)', default: '2' }
permissions: { contents: read }
concurrency: { group: core-keys-tile, cancel-in-progress: false }
jobs:
  composed-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/cache@v4
        with: { path: /opt/verilator, key: verilator-v5.048-u2404 }
      - uses: actions/cache@v4
        with: { path: /opt/spike, key: spike-riscv-isa-sim-u2404 }
      - name: Deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome* \
                     /etc/apt/sources.list.d/*microsoft* 2>/dev/null || true
          sudo apt-get update -qq || sudo apt-get update -qq
          sudo apt-get install -y -qq ccache python3 python3-pip gcc-riscv64-unknown-elf \
                                      binutils-riscv64-unknown-elf device-tree-compiler
          echo "verilator: $(/opt/verilator/bin/verilator --version 2>/dev/null || echo MISSING)"
          echo "spike:     $(ls /opt/spike/bin/spike 2>/dev/null || echo MISSING)"
      - name: Free disk (elaborating the cluster tops is a ~5 GB process)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -BG --output=avail / | tail -1
      - name: Checkout PRIVATE core (token masked)
        run: |
          set +e
          git clone --depth 1 --branch "${{ inputs.branch }}" \
            "https://x-access-token:${{ secrets.RTL_RUN_TOKEN_MLCORE }}@github.com/rahulprospera/hp_ml_core.git" core 2>ce.txt
          [ $? -eq 0 ] && echo "core checkout ok" || { echo "checkout FAILED:"; sed -E 's#(https://)[^@]*@#\1***@#g' ce.txt; exit 1; }
      - name: Checkout PRIVATE tile (token masked)
        run: |
          set +e
          git clone --depth 1 --branch hp-vpu-pipe-verif \
            "https://x-access-token:${{ secrets.RTL_RUN_TOKEN1 }}@github.com/rahulprospera/hp_vpu_ml_accelerator.git" tile 2>te.txt
          [ $? -eq 0 ] && echo "tile checkout ok" || { echo "tile checkout FAILED:"; sed -E 's#(https://)[^@]*@#\1***@#g' te.txt; exit 1; }
          ( cd tile && python3 scripts/gen_systemc_pkg_hp_vpu_3_0.py --sku DLEN256_GPU_FAB \
              --out generated/hp_vpu_3_0_config.h ) >/dev/null
          echo "vpu config generated"
      - name: Drop my host program into their progs flow
        run: |
          cp core/rtl/tb/progs/p1_straight.c /tmp/p1_original.c
          cp tile/sw/core_host/keytile_launch.c core/rtl/tb/progs/p1_straight.c
          echo "host program staged into p1_straight's slot (their list is fixed at 5 names)"
      - name: Config + program images
        run: |
          export PATH=/opt/verilator/bin:/opt/spike/bin:$PATH
          cd core/rtl
          python3 - config/rtl_core.json ${{ inputs.width }} <<'PY'
          import json,sys
          p,w=sys.argv[1],int(sys.argv[2]); c=json.load(open(p)); c["issue_width"]=w
          json.dump(c,open(p,"w"),indent=2)
          PY
          python3 flow/gen_rtl_config.py >/dev/null
          echo "issue_width=$(python3 -c "import json;print(json.load(open('config/rtl_core.json'))['issue_width'])")"
          echo "mul_lat=$(python3 -c "import json;print(json.load(open('config/rtl_core.json'))['rtl_only']['mul_lat'])")"
          for s in tb/progs/build*.sh; do [ -e "$s" ] && bash "$s" >/dev/null 2>&1; done
          echo "program images: $(ls tb/progs/build/*.hex 2>/dev/null | wc -l)"
      - name: Generate the system container from the core's port list
        run: |
          python3 tile/scripts/hp_vpu_3_0/gen_hpml_system.py \
            core/rtl/cluster/hpml_core.sv /tmp/hpml_system.sv
          cp /tmp/hpml_system.sv core/rtl/cluster/hpml_system.sv
          cp tile/verilator/tb_hpml_system.sv core/rtl/tb/tb_hpml_system.sv
          wc -l core/rtl/cluster/hpml_system.sv | awk '{print "container: "$1" lines"}'
      - name: Build the LOOP program image
        run: |
          export PATH=/opt/verilator/bin:/opt/spike/bin:$PATH
          cd core/rtl
          cp $GITHUB_WORKSPACE/tile/sw/core_host/keytile_loop.c tb/progs/p2_loop.c
          bash tb/progs/build.sh p2_loop >/dev/null 2>&1 || true
          ls -la tb/progs/build/p2_loop.hex 2>/dev/null | awk '{print "loop image: "$5" bytes"}' \
            || echo "loop image: NOT BUILT"
      - name: Build THE LOOP — core + memory + tile in one container
        run: |
          export PATH=/opt/verilator/bin:$PATH
          cd core/rtl
          V=$GITHUB_WORKSPACE/tile/rtl/engines/hp_vpu_3_0
          set +e
          verilator --binary --timing -Wall -Wno-fatal -j 1 --top-module tb_hpml_system \
            -Wno-PINMISSING -Wno-PINCONNECTEMPTY -Wno-WIDTH -Wno-UNUSED -Wno-DECLFILENAME \
            -Wno-SELRANGE -Wno-CASEINCOMPLETE -Wno-IMPLICIT -Wno-BLKANDNBLK \
            -y prim -y atoms -y leaves -y cluster -y tb -y $V -y $V/deps \
            +incdir+$V/deps +incdir+$GITHUB_WORKSPACE/tile/generated \
            $GITHUB_WORKSPACE/tile/generated/hp_vpu_3_0_config_pkg.sv \
            $V/deps/hp_vpu_pkg.sv \
            $V/hp_vpu_red_pair.sv $V/hp_vpu_pp_add.sv $V/hp_vpu_lut_rom.sv \
            $V/hp_vpu_decode.sv $V/hp_vpu_csr.sv $V/hp_vpu_hazard.sv $V/hp_vpu_sequencer.sv \
            $V/hp_vpu_vrf_banked.sv $V/hp_vpu_reduction.sv $V/deps/hp_vpu_kernel_engine.sv \
            $V/hp_vpu_top.sv $V/hpml_tile_bridge.sv \
            --Mdir /tmp/loop -o loop tb/tb_hpml_system.sv > /tmp/loop.build.log 2>&1
          echo "loop build exit=$?" > /tmp/loop.rc
          [ -x /tmp/loop/loop ] && echo "LOOP BUILT" >> /tmp/loop.rc || true
      - name: Loop verdict — ALLOWLIST ONLY
        if: always()
        shell: bash {0}
        run: |
          cat /tmp/loop.rc
          if grep -q "LOOP BUILT" /tmp/loop.rc; then
            cd core/rtl
            timeout 1800 /tmp/loop/loop +hex=tb/progs/build/p2_loop.hex > /tmp/loop.run.log 2>&1
            echo "loop run exit=$?"
            grep -aE "\[bridge\]|=== tb_hpml_system|program finished|answer read back|launches total|raster \(GPU|gemv   |::error::" \
              /tmp/loop.run.log | head -16 || echo "  no loop output"
          else
            echo "container did not build — the errors, deduplicated by KIND:"
            # Their file paths are RTL-shaped and must not reach a public log, so strip the
            # location and keep the message. A count tells you nothing; the kinds tell you what
            # to fix.
            grep -aoE "%Error[-A-Z]*: [^:]*: ?[0-9]*: ?(.*)" /tmp/loop.build.log \
              | sed -E 's#[^ ]*/[^ ]*\.sv##g; s/[0-9]+:[0-9]+//g' \
              | sed -E 's/^%Error[-A-Z]*: *//' | sort | uniq -c | sort -rn | head -14
            echo "--- first three in full, paths stripped ---"
            grep -aE "^%Error" /tmp/loop.build.log | sed -E 's#[^ ]*/##g' | head -3
          fi
      - name: Build tb_m5_program — THE COMPOSED MACHINE
        run: |
          export PATH=/opt/verilator/bin:$PATH
          cd core/rtl
          set +e
          V=$GITHUB_WORKSPACE/tile/rtl/engines/hp_vpu_3_0
          verilator --binary --timing -Wall -Wno-fatal -j 1 --top-module tb_m5_program \
            -Wno-PINMISSING -Wno-PINCONNECTEMPTY -Wno-WIDTH -Wno-UNUSED -Wno-DECLFILENAME \
            -y prim -y atoms -y leaves -y cluster -y tb \
            -y $V -y $V/deps \
            +incdir+$V/deps +incdir+$GITHUB_WORKSPACE/tile/generated \
            $GITHUB_WORKSPACE/tile/generated/hp_vpu_3_0_config_pkg.sv \
            $V/deps/hp_vpu_pkg.sv \
            $V/hp_vpu_red_pair.sv $V/hp_vpu_pp_add.sv $V/hp_vpu_lut_rom.sv \
            $V/hp_vpu_decode.sv $V/hp_vpu_csr.sv $V/hp_vpu_hazard.sv $V/hp_vpu_sequencer.sv \
            $V/hp_vpu_vrf_banked.sv $V/hp_vpu_reduction.sv $V/deps/hp_vpu_kernel_engine.sv \
            $V/hp_vpu_top.sv \
            $V/hpml_tile_bridge.sv $V/bind_tile.sv \
            --Mdir /tmp/m5 -o tb tb/tb_m5_program.sv > /tmp/m5.build.log 2>&1
          echo "build exit=$?" > /tmp/m5.rc
          [ -x /tmp/m5/tb ] && echo "EXECUTABLE BUILT" >> /tmp/m5.rc || true
      - name: Build verdict
        run: |
          cat /tmp/m5.rc
          grep -q "EXECUTABLE BUILT" /tmp/m5.rc \
            && echo "VERDICT: the composed core BUILDS" \
            || { echo "VERDICT: the composed core does NOT build"; exit 1; }
      - name: Execute a program on it
        run: |
          cd core/rtl
          set +e
          timeout 2400 /tmp/m5/tb +prog=1 > /tmp/m5.run.log 2>&1
          echo "run exit=$?" > /tmp/m5.runrc
      - name: Run verdict — ALLOWLIST ONLY
        run: |
          echo "--- did the host key the engines? ---"
          grep -aE "\[bridge\]|hpml_tile_bridge|launches total|raster \(GPU\)|gemv   \(FABRIC\)|::error::" \
            /tmp/m5.run.log | head -40 || echo "  no bridge output"
          echo "--- their own gate, unchanged ---"
          grep -iE "self-test|retired|answer|IPC" /tmp/m5.run.log | head -4 || echo "  no verdict line"
          cat /tmp/m5.runrc
          grep -icE "^ *FAIL|ERROR" /tmp/m5.run.log | sed 's/^/FAIL-or-ERROR lines: /' || true
      - name: Failure triage (allowlisted; RTL-shaped lines stripped)
        if: failure()
        run: |
          for L in /tmp/m5.build.log /tmp/m5.run.log; do
            [ -f "$L" ] || continue
            echo "--- $L ---"
            tail -60 "$L" | grep -viE '\.sv:|verilator |\+incdir|--Mdir|-y |%Warning' | tail -16
          done
          grep -oE "(%Error[^:]*:|USERERROR|Cannot find|No such file|Assertion)[^/]{0,90}" \
            /tmp/m5.build.log 2>/dev/null | sort -u | head -8 || true
