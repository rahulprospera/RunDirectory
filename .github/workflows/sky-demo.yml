name: sky-demo
# PUBLIC runner-shell. No RTL or source lives here; the private repo is cloned at runtime with
# RTL_RUN_TOKEN1 (masked, clone errors scrubbed).
#
# STRUCTURE — why this is four jobs and not one script:
#   A single job doing render + detect ran 2h10 for the render alone and would have come within
#   minutes of the 6 h per-job ceiling. Frames are independent (set_cam/track are closed forms of
#   the frame index), so both RTL passes shard by frame range and run as parallel jobs. The
#   Verilated executable is cached on the RTL hash, so only the first run after an RTL change
#   pays the build.
#
#     build  ->  render x4 (12 frames each)  ->  train  ->  detect x4  ->  collect
#
# DISCLOSURE SURFACE — this log is world-readable: runner capability, byte-exact pass/fail,
# cycles per frame, held-out F1, the backdrop check. NOT echoed: build logs (they carry the
# verilator command line = every RTL path and module name), RTL source, weights, signal names.
#
# The MP4 is composited on the laptop: reel_house.py loads macOS system fonts and degrades to a
# bitmap default here. CI does the slow RTL half and ships frames + detector output.
on:
  workflow_dispatch:
    inputs:
      branch: { description: 'private branch to run', default: 'hp-vpu-pipe-verif' }
      nf:     { description: 'frames in the sequence', default: '48' }
permissions: { contents: read }
concurrency: { group: sky-demo, cancel-in-progress: false }
env:
  SKU: DLEN256_GPU_FAB
  PRIV: rahulprospera/hp_vpu_ml_accelerator
jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      rtlkey: ${{ steps.k.outputs.key }}
    steps:
      - name: Check the private-repo tunnel is alive
        run: |
          set +e
          git ls-remote "https://x-access-token:${{ secrets.RTL_RUN_TOKEN1 }}@github.com/${{ env.PRIV }}.git" HEAD >/dev/null 2>tok_err.txt
          if [ $? -ne 0 ]; then
            echo "::error title=RTL_RUN_TOKEN1 is dead::Mint a fine-grained PAT (Contents Read-only) and: gh secret set RTL_RUN_TOKEN1 --repo rahulprospera/RunDirectory"
            sed -E 's#(https://)[^@]*@#\1***@#g' tok_err.txt | head -2; exit 1
          fi
          echo "tunnel ok"
      - uses: actions/cache@v4
        id: vc
        with: { path: /opt/verilator, key: verilator-v5.048-u2404 }
      - name: Build Verilator (miss only)
        if: steps.vc.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git perl python3 make autoconf g++ flex bison ccache \
            libgoogle-perftools-dev numactl zlib1g-dev help2man libfl-dev
          git clone https://github.com/verilator/verilator /tmp/v && cd /tmp/v
          git checkout v5.048 || git checkout stable
          autoconf && ./configure --prefix=/opt/verilator && make -j"$(nproc)" && sudo make install
      - name: Deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache python3 python3-pip && pip3 install --quiet numpy pillow
      - name: Checkout PRIVATE repo (token masked)
        run: |
          set +e
          git clone --depth 1 --branch "${{ inputs.branch }}" \
            "https://x-access-token:${{ secrets.RTL_RUN_TOKEN1 }}@github.com/${{ env.PRIV }}.git" src 2>clone_err.txt
          [ $? -eq 0 ] && echo "private checkout ok" || { echo "checkout FAILED:"; sed -E 's#(https://)[^@]*@#\1***@#g' clone_err.txt; exit 1; }
      - name: Executable cache key (RTL + harnesses)
        id: k
        run: echo "key=sky-${{ env.SKU }}-${{ hashFiles('src/rtl/engines/hp_vpu_3_0/**','src/generated/**','src/verilator/tb_isr_scene_top.cpp','src/verilator/tb_isr_demo_top.cpp','src/verilator/tb_isr_demo_scene.inc','src/scripts/hp_vpu_3_0/build_top_v15_gentle.sh') }}" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: dut
        with: { path: dut, key: "${{ steps.k.outputs.key }}" }
      - name: Build both executables (miss only)
        if: steps.dut.outputs.cache-hit != 'true'
        run: |
          export PATH=/opt/verilator/bin:$PATH
          mkdir -p /tmp/vb dut
          cd src
          set +e
          for h in tb_isr_scene_top:scene_fab tb_isr_demo_top:demo_fab; do
            H="${h%%:*}"; O="${h##*:}"
            SKU=$SKU HARNESS=$H.cpp TOP_OBJ=/tmp/vb/$O BUILD_JOBS="$(nproc)" ISR_NF=1 ISR_F1=0 \
              ISR_OUT=/tmp/vb/probe ISR_W=/tmp/vb/none \
              bash scripts/hp_vpu_3_0/build_top_v15_gentle.sh > /tmp/build_$O.log 2>&1
            if [ ! -x "/tmp/vb/$O/Vhp_vpu_top" ]; then echo "BUILD FAILED: $H"; exit 1; fi
            mkdir -p ../dut/$O && cp -r /tmp/vb/$O/* ../dut/$O/
            echo "built $H"
          done
      - name: Executable present
        run: ls dut/scene_fab/Vhp_vpu_top dut/demo_fab/Vhp_vpu_top >/dev/null && echo "both executables ready"

  render:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy: { fail-fast: false, matrix: { shard: [0, 1, 2, 3] } }
    steps:
      - uses: actions/cache@v4
        with: { path: /opt/verilator, key: verilator-v5.048-u2404 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache python3 python3-pip && pip3 install --quiet numpy pillow
      - name: Checkout PRIVATE repo (token masked)
        run: |
          set +e
          git clone --depth 1 --branch "${{ inputs.branch }}" \
            "https://x-access-token:${{ secrets.RTL_RUN_TOKEN1 }}@github.com/${{ env.PRIV }}.git" src 2>clone_err.txt
          [ $? -eq 0 ] || { echo "checkout FAILED:"; sed -E 's#(https://)[^@]*@#\1***@#g' clone_err.txt; exit 1; }
      - uses: actions/cache@v4
        with: { path: dut, key: "${{ needs.build.outputs.rtlkey }}" }
      - name: Render frames for this shard
        run: |
          export PATH=/opt/verilator/bin:$PATH
          NF=${{ inputs.nf }}; SH=${{ matrix.shard }}; PER=$(( (NF + 3) / 4 ))
          F0=$(( SH * PER )); F1=$(( F0 + PER )); [ $F1 -gt $NF ] && F1=$NF
          echo "shard $SH: frames $F0..$((F1-1)) of $NF"
          mkdir -p /tmp/vb/scene_fab && cp -r dut/scene_fab/* /tmp/vb/scene_fab/
          chmod +x /tmp/vb/scene_fab/Vhp_vpu_top
          cd src
          set +e
          SKU=$SKU HARNESS=tb_isr_scene_top.cpp TOP_OBJ=/tmp/vb/scene_fab BUILD_JOBS="$(nproc)" \
            ISR_NF=$NF ISR_F0=$F0 ISR_F1=$F1 ISR_OUT=/tmp/vb/sky48 \
            bash scripts/hp_vpu_3_0/build_top_v15_gentle.sh > /tmp/render.log 2>&1
          echo "exit=$?" > /tmp/render.rc
          mv /tmp/vb/sky48_truth.txt /tmp/vb/sky48_truth_$SH.txt 2>/dev/null || true
      - name: Verdict — ALLOWLIST ONLY
        run: |
          grep -E "^tb_isr_scene_top: pass=|^  resolution " /tmp/render.log || echo "no verdict line produced"
          cat /tmp/render.rc; grep -q "exit=0" /tmp/render.rc || exit 1
      - name: Failure triage (allowlisted; RTL-shaped lines stripped)
        if: failure()
        run: |
          # Whitelist is right for a verdict but useless for debugging, so this strips the lines
          # that name RTL -- .sv files, module/signal prefixes, verilator command lines -- and
          # shows what is left. Build output must never reach this public log unfiltered.
          for L in /tmp/render.log /tmp/detect.log; do
            [ -f "$L" ] || continue
            echo "--- $L, filtered ---"
            tail -40 "$L" \
              | grep -viE '\.sv\b|hp_vpu_[a-z_]+|verilator |\+incdir|--Mdir|-y |rtl/' \
              | tail -15
          done
          grep -oE "(No such file or directory|Permission denied|command not found|cannot open|Segmentation fault|Assertion|BUILD FAILED|Error [0-9]+|make: \*\*\*)[^/]{0,70}" \
            /tmp/render.log /tmp/detect.log 2>/dev/null | head -6 || true
      - name: Backdrop coverage check (the reason for this run)
        run: |
          cd src
          python3 - <<'PY'
          import glob, sys, numpy as np
          sys.path.insert(0, 'scripts/hp_vpu_3_0'); import demo_train as T
          fs = sorted(glob.glob('/tmp/vb/sky48_f*.ppm')); bad = 0
          for f in fs:
              a, w, h = T.read_ppm(f)
              if abs(np.asarray(a).astype(int)[0, w//2] - np.array([150,190,228])).sum() < 12: bad += 1
          print("backdrop: %d/%d frames still show the clear at row 0 (want 0)" % (bad, len(fs)))
          sys.exit(1 if bad else 0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.shard }}
          path: |
            /tmp/vb/sky48_f*.ppm
            /tmp/vb/sky48_truth_*.txt
          retention-days: 3

  train:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache python3 python3-pip && pip3 install --quiet numpy pillow
      - name: Checkout PRIVATE repo (token masked)
        run: |
          set +e
          git clone --depth 1 --branch "${{ inputs.branch }}" \
            "https://x-access-token:${{ secrets.RTL_RUN_TOKEN1 }}@github.com/${{ env.PRIV }}.git" src 2>clone_err.txt
          [ $? -eq 0 ] || { echo "checkout FAILED:"; sed -E 's#(https://)[^@]*@#\1***@#g' clone_err.txt; exit 1; }
      - uses: actions/download-artifact@v4
        with: { pattern: frames-*, merge-multiple: true, path: /tmp/vb }
      - name: Merge shard truth files and train
        run: |
          cd src
          n=$(ls /tmp/vb/sky48_f*.ppm | wc -l); echo "frames collected: $n / ${{ inputs.nf }}"
          [ "$n" -eq "${{ inputs.nf }}" ] || { echo "ABORT: shards did not cover the sequence"; exit 1; }
          head -1 $(ls /tmp/vb/sky48_truth_*.txt | head -1) > /tmp/vb/sky48_truth.txt
          cat /tmp/vb/sky48_truth_*.txt | grep -v '^#' >> /tmp/vb/sky48_truth.txt
          python3 scripts/hp_vpu_3_0/demo_train.py /tmp/vb/sky48 /tmp/vb/sky 2>&1 | grep -E "frames |train |contrast |HELD-OUT|wrote"
      - uses: actions/upload-artifact@v4
        with:
          name: weights
          path: |
            /tmp/vb/sky_w0.i8
            /tmp/vb/sky_cfg.txt
            /tmp/vb/sky48_truth.txt
          retention-days: 3

  detect:
    needs: [build, train]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy: { fail-fast: false, matrix: { shard: [0, 1, 2, 3] } }
    steps:
      - uses: actions/cache@v4
        with: { path: /opt/verilator, key: verilator-v5.048-u2404 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache python3 python3-pip && pip3 install --quiet numpy
      - name: Checkout PRIVATE repo (token masked)
        run: |
          set +e
          git clone --depth 1 --branch "${{ inputs.branch }}" \
            "https://x-access-token:${{ secrets.RTL_RUN_TOKEN1 }}@github.com/${{ env.PRIV }}.git" src 2>clone_err.txt
          [ $? -eq 0 ] || { echo "checkout FAILED:"; sed -E 's#(https://)[^@]*@#\1***@#g' clone_err.txt; exit 1; }
      - uses: actions/cache@v4
        with: { path: dut, key: "${{ needs.build.outputs.rtlkey }}" }
      - uses: actions/download-artifact@v4
        with: { name: weights, path: /tmp/vb }
      - name: GPU raster + INT8 fabric detect for this shard
        run: |
          export PATH=/opt/verilator/bin:$PATH
          NF=${{ inputs.nf }}; SH=${{ matrix.shard }}; PER=$(( (NF + 3) / 4 ))
          F0=$(( SH * PER )); F1=$(( F0 + PER )); [ $F1 -gt $NF ] && F1=$NF
          echo "shard $SH: frames $F0..$((F1-1)) of $NF"
          mkdir -p /tmp/vb/demo_fab && cp -r dut/demo_fab/* /tmp/vb/demo_fab/
          chmod +x /tmp/vb/demo_fab/Vhp_vpu_top
          cd src
          set +e
          SKU=$SKU HARNESS=tb_isr_demo_top.cpp TOP_OBJ=/tmp/vb/demo_fab BUILD_JOBS="$(nproc)" \
            ISR_NF=$NF ISR_F0=$F0 ISR_F1=$F1 ISR_OUT=/tmp/vb/skyrun ISR_W=/tmp/vb/sky \
            bash scripts/hp_vpu_3_0/build_top_v15_gentle.sh > /tmp/detect.log 2>&1
          echo "exit=$?" > /tmp/detect.rc
          mv /tmp/vb/skyrun_out.txt /tmp/vb/skyrun_out_$SH.txt 2>/dev/null || true
      - name: Verdict — ALLOWLIST ONLY
        run: |
          grep -E "^  raster |us/frame|pass=" /tmp/detect.log || echo "no verdict line produced"
          cat /tmp/detect.rc; grep -q "exit=0" /tmp/detect.rc || exit 1
      - name: Failure triage (allowlisted; RTL-shaped lines stripped)
        if: failure()
        run: |
          # Whitelist is right for a verdict but useless for debugging, so this strips the lines
          # that name RTL -- .sv files, module/signal prefixes, verilator command lines -- and
          # shows what is left. Build output must never reach this public log unfiltered.
          for L in /tmp/render.log /tmp/detect.log; do
            [ -f "$L" ] || continue
            echo "--- $L, filtered ---"
            tail -40 "$L" \
              | grep -viE '\.sv\b|hp_vpu_[a-z_]+|verilator |\+incdir|--Mdir|-y |rtl/' \
              | tail -15
          done
          grep -oE "(No such file or directory|Permission denied|command not found|cannot open|Segmentation fault|Assertion|BUILD FAILED|Error [0-9]+|make: \*\*\*)[^/]{0,70}" \
            /tmp/render.log /tmp/detect.log 2>/dev/null | head -6 || true
      - uses: actions/upload-artifact@v4
        with: { name: "detect-${{ matrix.shard }}", path: /tmp/vb/skyrun_out_*.txt, retention-days: 3 }

  collect:
    needs: [render, train, detect]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache python3 python3-pip && pip3 install --quiet numpy
      - uses: actions/download-artifact@v4
        with: { pattern: "*", merge-multiple: true, path: /tmp/vb }
      - name: Merge shards and report
        run: |
          head -1 $(ls /tmp/vb/skyrun_out_*.txt | head -1) > /tmp/vb/skyrun_out.txt
          cat /tmp/vb/skyrun_out_*.txt | grep -v '^#' | sort -n -k1 >> /tmp/vb/skyrun_out.txt
          cp /tmp/vb/sky_cfg.txt /tmp/vb/skyrun_cfg.txt
          python3 - <<'PY'
          import numpy as np
          rows = [l.split() for l in open('/tmp/vb/skyrun_out.txt') if not l.startswith('#')]
          rc = np.array([int(v[1]) for v in rows]); fc = np.array([int(v[2]) for v in rows])
          thr = int(open('/tmp/vb/sky_cfg.txt').read().split()[5])
          lg = np.array([[int(x) for x in v[4:20]] for v in rows])
          sky = [c for c in range(16) if c//4 < 3]
          print("frames  %d" % len(rows))
          print("fabric  %s cyc   JITTER=%d" % (sorted(set(fc.tolist())), fc.max()-fc.min()))
          print("raster  %d..%d cyc   spread=%.1f%%" % (rc.min(), rc.max(), 100*(rc.max()-rc.min())/rc.mean()))
          print("detect  %.2f cells/frame   ground-row fires=%d (gated out of the search volume)"
                % ((lg[:, sky] > thr).sum()/len(rows), (lg[:, [c for c in range(16) if c//4==3]] > thr).sum()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sky-demo
          path: |
            /tmp/vb/sky48_f*.ppm
            /tmp/vb/sky48_truth.txt
            /tmp/vb/sky_w0.i8
            /tmp/vb/sky_cfg.txt
            /tmp/vb/skyrun_out.txt
            /tmp/vb/skyrun_cfg.txt
          retention-days: 7
